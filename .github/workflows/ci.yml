name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: lint, duplication and security (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: make lint
        run: make lint

      - name: Check duplication marker balance
        shell: bash
        run: |
          unbalanced=0
          while IFS= read -r file; do
            starts=$(grep -c 'jscpd:ignore-start' "$file" || true)
            ends=$(grep -c 'jscpd:ignore-end' "$file" || true)
            if [[ "$starts" -ne "$ends" ]]; then
              echo "::error file=$file::Unbalanced duplication markers ($starts starts, $ends ends)"
              unbalanced=1
            fi
          done < <(git ls-files -- '*.go')
          exit "$unbalanced"

      - name: jscpd
        run: npx --yes jscpd@5.1.2 --config .jscpd.json --no-tips .

      - name: Trivy
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            aquasec/trivy:0.76.2 fs . \
            --skip-dirs .agents --ignorefile .trivyignore.yaml --exit-code 1

  test:
    name: make test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: make test
        run: make test

      - name: Race-check the standalone release smoke tool
        if: runner.os == 'Linux'
        run: |
          make build
          go run -race scripts/smoke-release.go -binary ./mavis

  coverage:
    name: make coverage (>= 85%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: make coverage
        run: make coverage

      - name: Add coverage summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload coverage profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage.out
          path: coverage.out
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [quality, test, coverage]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: dist/mavis-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output: dist/mavis-darwin-arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: dist/mavis-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            output: dist/mavis-linux-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: dist/mavis-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build standalone binary
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -o "${{ matrix.output }}" ./cmd/mavis

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}-binary
          path: ${{ matrix.output }}
          retention-days: 14
          if-no-files-found: error
